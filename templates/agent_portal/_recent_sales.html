{% for s in recent_sales %}
<div class="recent-sale-row" data-sale-id="{{ s.id }}">
  <span class="recent-sale-main">{{ s.quantity }}x {{ s.product }}</span>
  <span class="recent-sale-meta muted small">{{ s.points }} pts · {{ s.sold_at|date:"M j, g:ia" }}</span>
  {% if s.status == 'pending' %}
    <button type="button" class="recent-sale-cancel" data-sale-id="{{ s.id }}" aria-label="Cancel this submission">Cancel</button>
  {% endif %}
  <span class="pill {% if s.status == 'approved' %}pill-success{% elif s.status == 'rejected' %}pill-danger{% else %}pill-warning{% endif %}">{{ s.status_label }}</span>
</div>
{% empty %}
<p class="muted small">No sales logged yet — your submissions will show up here.</p>
{% endfor %}
